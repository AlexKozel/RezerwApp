name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Пока pnpm-lock.yaml не закоммичен, фиксированная установка невозможна.
      # После первого локального `pnpm install` закоммитьте lock-файл и замените на --frozen-lockfile.
      - run: pnpm install --no-frozen-lockfile

      - run: pnpm build
      - run: pnpm typecheck

      - name: Проверка слоя БД (гонки, EXCLUDE, RLS, права)
        run: bash scripts/verify-db.sh

      - name: Тесты
        run: pnpm test
