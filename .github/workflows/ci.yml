name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm typecheck

      - name: Проверка слоя БД (гонки, EXCLUDE, RLS, права)
        run: bash scripts/verify-db.sh

      - name: Тесты
        run: pnpm test
