services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rezerwapp
      POSTGRES_PASSWORD: rezerwapp
      POSTGRES_DB: rezerwapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezerwapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      # 6380 на хосте: 6379 часто занят локальным Redis/Memurai.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
